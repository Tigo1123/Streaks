function validChallenge(c){return c&&typeof c.id==="string"&&typeof c.name==="string"&&Number.isInteger(c.durationDays)&&c.durationDays>=1&&c.durationDays<=365&&validDate(c.startDate)&&Array.isArray(c.completedDays)&&new Set(c.completedDays).size===c.completedDays.length&&c.completedDays.every(n=>Number.isInteger(n)&&n>=1&&n<=c.durationDays)&&typeof c.createdAt==="string"&&validTimestamp(c.createdAt)&&(c.note===undefined||typeof c.note==="string")}

function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

async function restoreSession(){
  const token=readAuthToken();authState.token=token;authState.user=null;authState.noticeKey=null;
  if(!token){authState.status="unauthenticated";updateAuthButton();return}
  const operation=++authOperation;authState.status="loading";updateAuthButton();
  try{
    const{response,payload}=await authRequest("/api/auth/me",{token});
    if(operation!==authOperation)return;
    if(response.status===401){clearAuthToken();authState={status:"unauthenticated",token:null,user:null,noticeKey:"authSessionExpired",formErrorKey:null};}
    else if(!response.ok||!validAuthUser(payload?.user)){authState.status="backendUnavailable";}
    else{authState.status="authenticated";authState.user=payload.user;authState.token=token;}
  }catch(_){if(operation===authOperation)authState.status="backendUnavailable"}
  updateAuthButton();if(modalMode==="auth")renderAuthModal(false);

function authFormValues(registering){
  const email=String($("#authEmailInput")?.value||"").trim().toLowerCase();
  const password=$("#authPasswordInput")?.value||"";
  const confirmation=$("#authConfirmInput")?.value||"";
  if(!email)return{error:"authEmailRequired"};
  if(email.length>254||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return{error:"authInvalidEmail"};
  if(!password)return{error:"authPasswordRequired"};
  if(registering&&Array.from(password).length<8)return{error:"authPasswordShort"};
  if(registering&&password!==confirmation)return{error:"authPasswordMismatch"};
  return{email,password};
}
function failureKey(status){
  if(status===401)return"authInvalidCredentials";
  if(status===409)return"authDuplicateEmail";
  if(status===400)return"authInvalidRequest";
  if(status>=500)return"authServerError";
  return"authServerError";
}
function acceptAuth(payload){
  if(typeof payload?.token!=="string"||!payload.token||!validAuthUser(payload.user))return false;
  const saved=saveAuthToken(payload.token);
  authState={status:"authenticated",token:payload.token,user:payload.user,noticeKey:null,formErrorKey:null};
  updateAuthButton();closeAuthModal();showToast(t(saved?"authSuccess":"authTokenNotSaved"));return true;

async function submitAuthForm(event){

  if(!registering&&form.id!=="authLoginForm")return;
  event.preventDefault();if(authSubmitting)return;
  authState.formErrorKey=null;authState.noticeKey=null;const values=authFormValues(registering);
  if(values.error){setAuthError(values.error);return}

  let accountCreated=false;
  try{
    if(registering){
      const created=await authRequest("/api/auth/register",{method:"POST",body:{email:values.email,password:values.password}});
      if(operation!==authOperation)return;
      if(!created.response.ok){authState.status=[400,409].includes(created.response.status)?"unauthenticated":"backendUnavailable";setAuthError(failureKey(created.response.status));return}
      if(created.response.status!==201){authState.status="backendUnavailable";setAuthError("authServerError");return}
      accountCreated=true;
    }
    const result=await authRequest("/api/auth/login",{method:"POST",body:{email:values.email,password:values.password}});
    if(operation!==authOperation)return;
    if(!result.response.ok){
      if(accountCreated){authEmailDraft=values.email;authState.status=[400,401].includes(result.response.status)?"unauthenticated":"backendUnavailable";switchAuthView("login",true);authState.noticeKey="authRegistrationNeedsLogin";renderAuthModal(true);return}

    }
