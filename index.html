<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f0f0f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Streaks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Streaks — small steps, kept daily</title>
<style>
:root{color-scheme:light;--bg:#f0f0f0;--paper:#fff;--ink:#242424;--muted:#707070;--coral:#ef6f65;--line:#dedede;--soft:#fff2f0;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}.shell{max-width:1060px;margin:auto;padding:22px 18px 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:36px}.brand{font:700 1.55rem/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.04em}.top-actions{display:flex;gap:8px}.button,.icon-button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:10px 16px;transition:background .18s,border-color .18s,transform .18s}.button:hover,.icon-button:hover{background:#fafafa;border-color:#bbb}.button:active,.icon-button:active{transform:scale(.98)}.button.primary{background:var(--coral);color:#fff;border-color:var(--coral);font-weight:650}.button.primary:hover{background:#df6259}.button.danger{color:#ad3c36}.icon-button{padding:8px 12px}.heading{font:500 clamp(2rem,6vw,3.2rem)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.04em;margin:0 0 10px}.subheading{color:var(--muted);margin:0 0 26px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}.card,.panel{background:var(--paper);border:1px solid rgba(0,0,0,.035);border-radius:var(--radius);padding:20px;box-shadow:0 5px 18px rgba(0,0,0,.025)}.challenge-card{cursor:pointer;transition:transform .18s,box-shadow .18s}.challenge-card:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(0,0,0,.06)}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.card h2,.panel h2{font:600 1.42rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 8px}.card p{margin:0}.status{display:inline-flex;align-items:center;border-radius:999px;background:#f1f1f1;color:#565656;padding:4px 10px;font-size:.78rem;font-weight:650;white-space:nowrap}.status.active{background:#edf5ed;color:#3a693b}.status.complete{background:var(--soft);color:#a8463e}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:.86rem;margin:22px 0 8px}.progress{height:8px;border-radius:9px;background:#eee;overflow:hidden}.progress span{display:block;height:100%;background:var(--coral);border-radius:inherit;transition:width .25s}html[dir="rtl"] .progress span{margin-left:auto}.empty{padding:48px 24px;text-align:center;color:var(--muted);border:1px dashed #cfcfcf;border-radius:var(--radius)}.empty h2{font:500 1.5rem Georgia,serif;color:var(--ink);margin:0 0 8px}.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:18px}.back:hover{color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.stat{background:#f7f7f7;border-radius:13px;padding:13px}.stat strong{display:block;font:600 1.35rem Georgia,serif}.stat span{font-size:.78rem;color:var(--muted)}.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(43px,1fr));gap:9px;margin-top:20px}.day{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--coral);background:#fff;color:var(--ink);font-size:.88rem;transition:background .16s,color .16s,transform .16s}.day:hover:not(:disabled){transform:scale(1.06)}.day.done{background:var(--coral);color:white}.day.today{box-shadow:0 0 0 3px rgba(239,111,101,.2)}.day.future{border-color:#ddd;color:#aaa}.note{margin-top:18px}.note label,.field label{display:block;font-weight:600;margin-bottom:6px}.note textarea,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink)}.note .button{margin-top:10px}textarea{resize:vertical;min-height:75px}.field{margin:15px 0}.field-hint{font-size:.82rem;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:rgba(20,20,20,.35);display:grid;place-items:center;padding:16px;z-index:5}.modal{width:min(100%,430px);background:white;border-radius:20px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.18)}.modal h2{font:600 1.7rem Georgia,serif;margin:0 0 8px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#272727;color:white;padding:12px 18px;border-radius:999px;box-shadow:0 6px 24px #0003;z-index:8;text-align:center;max-width:calc(100% - 32px)}[hidden]{display:none!important}:focus-visible{outline:3px solid #4778c7;outline-offset:3px}html[dir="rtl"] .progress-label{direction:rtl}@media(max-width:540px){.shell{padding:17px 14px 42px}.topbar{margin-bottom:30px}.topbar .button{padding:9px 12px}.stats{grid-template-columns:repeat(2,1fr)}.detail-head{display:block}.detail-head .button{margin-top:12px}.day-grid{grid-template-columns:repeat(auto-fill,minmax(39px,1fr));gap:7px}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand">Streaks<span aria-hidden="true">.</span></div><div class="top-actions"><button class="icon-button" id="languageButton" type="button"></button><button class="icon-button" id="exportButton" type="button"></button><button class="icon-button" id="importButton" type="button"></button><input id="importFile" type="file" accept="application/json,.json" hidden></div></header>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
// i18n
const i18n={en:{tagline:"Small steps, kept daily.",newChallenge:"New challenge",emptyTitle:"Start with one small promise.",emptyText:"Create a challenge and give your next days a little direction.",create:"Create challenge",name:"Challenge name",namePlaceholder:"For example, read every day",duration:"Duration",days:"days",custom:"Custom…",startDate:"Start date",cancel:"Cancel",save:"Create challenge",required:"Add a name to continue.",invalidDate:"Choose a valid start date.",today:"Today",dayOf:"Day {day} of {total}",active:"Active",completed:"Completed",missed:"Missed days",progress:"Progress",completion:"Complete",currentStreak:"Current streak",longestStreak:"Longest streak",remaining:"Days incomplete",tracker:"Daily tracker",markDone:"Mark day {day} complete",markUndone:"Unmark day {day}",future:"Day {day}, in the future",note:"Note (optional)",notePlaceholder:"A thought or reminder…",saveNote:"Save note",back:"All challenges",delete:"Delete",confirmDelete:"Delete this challenge?",deleteText:"This challenge and its check-ins will be removed.",confirm:"Delete challenge",deleted:"Challenge deleted.",congrats:"You did it! Challenge complete — every day counts.",export:"Export",import:"Import",importBad:"That file is not valid Streaks data.",importConfirm:"Replace your current challenges with this file?",importDone:"Data imported.",saved:"Note saved",saveFailed:"Could not save your changes. Your browser may have blocked local storage.",percent:"{percent}%",startFuture:"Starts in {count} days",noDays:"No days left",language:"العربية",languageLabel:"Switch language to Arabic",challengeCount:"{count} challenges",created:"Created {date}"},ar:{tagline:"خطوات صغيرة، كل يوم.",newChallenge:"تحدٍ جديد",emptyTitle:"ابدأ بوعد صغير.",emptyText:"أنشئ تحدياً واجعل أيامك القادمة أكثر وضوحاً.",create:"إنشاء تحدٍ",name:"اسم التحدي",namePlaceholder:"مثال: القراءة كل يوم",duration:"المدة",days:"أيام",custom:"مخصص…",startDate:"تاريخ البدء",cancel:"إلغاء",save:"إنشاء التحدي",required:"أدخل اسماً للمتابعة.",invalidDate:"اختر تاريخ بدء صالحاً.",today:"اليوم",dayOf:"اليوم {day} من {total}",active:"نشط",completed:"مكتمل",missed:"أيام فائتة",progress:"التقدم",completion:"الإنجاز",currentStreak:"السلسلة الحالية",longestStreak:"أطول سلسلة",remaining:"أيام غير مكتملة",tracker:"المتابعة اليومية",markDone:"إكمال اليوم {day}",markUndone:"إلغاء إكمال اليوم {day}",future:"اليوم {day}، في المستقبل",note:"ملاحظة (اختيارية)",notePlaceholder:"فكرة أو تذكير…",saveNote:"حفظ الملاحظة",back:"كل التحديات",delete:"حذف",confirmDelete:"هل تريد حذف هذا التحدي؟",deleteText:"سيتم حذف التحدي وعلامات الإنجاز الخاصة به.",confirm:"حذف التحدي",deleted:"تم حذف التحدي.",congrats:"أحسنت! اكتمل التحدي — كل يوم كان مهماً.",export:"تصدير",import:"استيراد",importBad:"هذا الملف ليس بيانات Streaks صالحة.",importConfirm:"استبدال تحدياتك الحالية بهذا الملف؟",importDone:"تم استيراد البيانات.",saved:"تم حفظ الملاحظة",saveFailed:"تعذر حفظ التغييرات. قد يكون المتصفح قد منع التخزين المحلي.",percent:"{percent}٪",startFuture:"يبدأ بعد {count} يوم",noDays:"انتهت الأيام",language:"English",languageLabel:"التبديل إلى الإنجليزية",challengeCount:"{count} تحديات",created:"أُنشئ {date}"}};
// state
const STORAGE_KEY="streaks-data",VERSION=1;let state={version:VERSION,language:"en",challenges:[]},selectedId=null,modalMode=null,modalOpener=null,toastTimer;
const $=s=>document.querySelector(s),main=$("#main");
function t(key,values={}){return (i18n[state.language][key]||i18n.en[key]||key).replace(/\{(\w+)\}/g,(_,k)=>values[k]??"")}
// storage
function validChallenge(c){return c&&typeof c.id==="string"&&typeof c.name==="string"&&Number.isInteger(c.durationDays)&&c.durationDays>=1&&c.durationDays<=365&&validDate(c.startDate)&&Array.isArray(c.completedDays)&&new Set(c.completedDays).size===c.completedDays.length&&c.completedDays.every(n=>Number.isInteger(n)&&n>=1&&n<=c.durationDays)&&typeof c.createdAt==="string"&&validTimestamp(c.createdAt)&&(c.note===undefined||typeof c.note==="string")}
function validImportChallenge(c){return validChallenge(c)&&c.completedDays.every(n=>n<=Math.min(c.durationDays,Math.max(0,dayIndex(c))))}
function validTimestamp(s){if(typeof s!=="string"||!/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/.test(s))return false;const d=new Date(s);return Number.isFinite(d.getTime())&&d.toISOString()===s}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const data=JSON.parse(raw);if(data&&data.version===VERSION){state={version:VERSION,language:data.language==="ar"?"ar":"en",challenges:Array.isArray(data.challenges)?data.challenges.filter(validChallenge):[]}}}catch(_){state={version:VERSION,language:"en",challenges:[]}}}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true}catch(_){showToast(t("saveFailed"));return false}}
// logic
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function validDate(s){if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split("-").map(Number),x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d}
function dateValue(s){const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}
const DAY_MS=86400000;
function dayIndex(c){return Math.floor((dateValue(localToday())-dateValue(c.startDate))/DAY_MS)+1}
function elapsed(c){return Math.min(c.durationDays,Math.max(0,dayIndex(c)))}
function progress(c){return Math.round(c.completedDays.length/c.durationDays*100)}
function streakStats(c){const done=new Set(c.completedDays),today=elapsed(c);let longest=0,run=0;for(let n=1;n<=c.durationDays;n++){run=done.has(n)?run+1:0;longest=Math.max(longest,run)}let current=0,n=Math.min(today,c.durationDays);if(n>0&&!done.has(n))n--;while(n>0&&done.has(n)){current++;n--}return{current,longest}}
function status(c){if(progress(c)===100)return"completed";return elapsed(c)>0&&Array.from({length:elapsed(c)},(_,i)=>i+1).some(n=>!c.completedDays.includes(n))?"missed":"active"}
function remaining(c){return Math.max(0,c.durationDays-c.completedDays.length)}
// render
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){document.documentElement.lang=state.language;document.documentElement.dir=state.language==="ar"?"rtl":"ltr";$("#languageButton").textContent=t("language");$("#languageButton").setAttribute("aria-label",t("languageLabel"));$("#exportButton").textContent=t("export");$("#importButton").textContent=t("import");const c=state.challenges.find(x=>x.id===selectedId);if(selectedId&&!c)selectedId=null;main.innerHTML=selectedId?renderDetail(c):renderHome()}
function renderHome(){const cards=state.challenges.map(c=>{const p=progress(c),s=status(c),d=dayIndex(c);return `<article class="card challenge-card" data-open="${esc(c.id)}" tabindex="0" role="button" aria-label="${esc(c.name)}, ${t("percent",{percent:p})}"><div class="card-top"><div><h2>${esc(c.name)}</h2><p class="status ${s==="completed"?"complete":s}">${t(s)}</p></div></div><div class="progress-label"><span>${d<1?t("startFuture",{count:1-d}):t("dayOf",{day:Math.min(d,c.durationDays),total:c.durationDays})}</span><span>${t("percent",{percent:p})}</span></div><div class="progress" role="progressbar" aria-label="${t("progress")}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><span style="width:${p}%"></span></div></article>`}).join("");return `<h1 class="heading">${t("tagline")}</h1><div class="toolbar"><span class="field-hint">${state.challenges.length?t("challengeCount",{count:state.challenges.length}):""}</span><button class="button primary" data-action="new">＋ ${t("newChallenge")}</button></div>${cards?`<section class="cards" aria-label="${t("challengeCount",{count:state.challenges.length})}">${cards}</section>`:`<section class="empty"><h2>${t("emptyTitle")}</h2><p>${t("emptyText")}</p><button class="button primary" data-action="new" style="margin-top:18px">${t("create")}</button></section>`}`}
function renderDetail(c){const p=progress(c),s=streakStats(c),today=dayIndex(c),d=elapsed(c),days=Array.from({length:c.durationDays},(_,i)=>{const n=i+1,done=c.completedDays.includes(n),future=n>today;return `<button type="button" class="day${done?" done":""}${n===today?" today":""}${future?" future":""}" data-day="${n}" ${future?"disabled":""} aria-pressed="${done}" aria-label="${future?t("future",{day:n}):t(done?"markUndone":"markDone",{day:n})}" title="${t("dayOf",{day:n,total:c.durationDays})}">${n}</button>`}).join("");return `<button class="back" data-action="back">← ${t("back")}</button><section class="panel"><div class="detail-head"><div><h1 class="heading">${esc(c.name)}</h1><span class="status ${status(c)==="completed"?"complete":status(c)}">${t(status(c))}</span></div><button class="button danger" data-action="delete">${t("delete")}</button></div><div class="stats"><div class="stat"><strong>${t("percent",{percent:p})}</strong><span>${t("completion")}</span></div><div class="stat"><strong>${s.current}</strong><span>${t("currentStreak")}</span></div><div class="stat"><strong>${s.longest}</strong><span>${t("longestStreak")}</span></div><div class="stat"><strong>${remaining(c)}</strong><span>${t("remaining")}</span></div></div><div class="progress" role="progressbar" aria-label="${t("progress")}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><span style="width:${p}%"></span></div><h2 style="margin-top:28px">${t("tracker")}</h2><div class="day-grid">${days}</div><div class="note"><label for="challengeNote">${t("note")}</label><textarea id="challengeNote" maxlength="1000" placeholder="${t("notePlaceholder")}">${esc(c.note||"")}</textarea><button type="button" class="button" data-action="save-note">${t("saveNote")}</button></div></section>`}
function showModal(mode,opener=document.activeElement){modalMode=mode;modalOpener=opener;const create=mode==="create";$("#modalRoot").innerHTML=`<div class="modal-backdrop" data-action="dismiss"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${create?t("create"):t("confirmDelete")}</h2>${create?`<form id="createForm"><div class="field"><label for="challengeName">${t("name")}</label><input id="challengeName" name="name" maxlength="80" required placeholder="${t("namePlaceholder")}"></div><div class="field"><label for="duration">${t("duration")}</label><select id="duration" name="duration"><option value="7">7 ${t("days")}</option><option value="10">10 ${t("days")}</option><option value="30" selected>30 ${t("days")}</option><option value="90">90 ${t("days")}</option><option value="custom">${t("custom")}</option></select><input id="customDuration" type="number" min="1" max="365" placeholder="1–365" hidden></div><div class="field"><label for="startDate">${t("startDate")}</label><input id="startDate" name="startDate" type="date" value="${localToday()}" required></div><div class="modal-actions"><button class="button" type="button" data-action="close">${t("cancel")}</button><button class="button primary" type="submit">${t("save")}</button></div></form>`:`<p>${t("deleteText")}</p><div class="modal-actions"><button class="button" data-action="close">${t("cancel")}</button><button class="button danger" data-action="confirm-delete">${t("confirm")}</button></div>`}</section></div>`;if(create){$("#duration").addEventListener("change",e=>{$("#customDuration").hidden=e.target.value!=="custom"});$("#challengeName").focus()}else $("[data-action=confirm-delete]").focus()}
function closeModal(){const opener=modalOpener;$("#modalRoot").innerHTML="";modalMode=null;modalOpener=null;setTimeout(()=>{if(opener?.isConnected&&typeof opener.focus==="function")opener.focus();else main.focus()},0)}
function snapshot(){return JSON.parse(JSON.stringify(state))}
function showToast(message){const el=$("#toast");el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3200)}
// events
main.addEventListener("click",e=>{const card=e.target.closest("[data-open]");if(card){selectedId=card.dataset.open;render();main.focus();return}const day=e.target.closest("[data-day]");if(day){const before=snapshot(),c=state.challenges.find(x=>x.id===selectedId),n=Number(day.dataset.day),was=progress(c)===100;c.completedDays=c.completedDays.includes(n)?c.completedDays.filter(x=>x!==n):[...c.completedDays,n].sort((a,b)=>a-b);const saved=persist();if(!saved)state=before;render();if(saved&&!was&&progress(c)===100)showToast(t("congrats"));return}const action=e.target.closest("[data-action]")?.dataset.action;if(action==="save-note"){const before=snapshot(),c=state.challenges.find(x=>x.id===selectedId);if(c){c.note=$("#challengeNote").value.trim();if(persist())showToast(t("saved"));else state=before}return}if(action==="new")showModal("create",e.target.closest("[data-action]"));if(action==="back"){selectedId=null;render()}if(action==="delete")showModal("delete",e.target.closest("[data-action]"))});
main.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open]")){e.preventDefault();selectedId=e.target.dataset.open;render()}});
$("#modalRoot").addEventListener("click",e=>{const action=e.target.closest("[data-action]")?.dataset.action;if(action==="close"||action==="dismiss"&&e.target===e.currentTarget.firstElementChild)closeModal();if(action==="confirm-delete"){const before=snapshot();state.challenges=state.challenges.filter(c=>c.id!==selectedId);if(!persist()){state=before;return}selectedId=null;closeModal();render();showToast(t("deleted"))}});
$("#modalRoot").addEventListener("submit",e=>{if(e.target.id!=="createForm")return;e.preventDefault();const data=new FormData(e.target),name=String(data.get("name")||"").trim(),raw=$("#duration").value,duration=raw==="custom"?Number($("#customDuration").value):Number(raw),startDate=String(data.get("startDate")||"");if(!name){showToast(t("required"));return}if(!Number.isInteger(duration)||duration<1||duration>365||!validDate(startDate)){showToast(t("invalidDate"));return}const before=snapshot();state.challenges.unshift({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,name,durationDays:duration,startDate,completedDays:[],createdAt:new Date().toISOString()});if(!persist()){state=before;return}selectedId=state.challenges[0].id;closeModal();render()});
document.addEventListener("keydown",e=>{if(!modalMode)return;if(e.key==="Escape"){e.preventDefault();closeModal();return}if(e.key!=="Tab")return;const modal=$("#modalRoot [role=dialog]"),items=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>!el.hidden&&el.getClientRects().length);if(!items.length){e.preventDefault();modal.focus();return}const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))){e.preventDefault();first.focus()}});
$("#languageButton").addEventListener("click",()=>{const before=snapshot();state.language=state.language==="en"?"ar":"en";if(!persist())state=before;render()});
$("#exportButton").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="streaks-data.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),0)});
$("#importButton").addEventListener("click",()=>$("#importFile").click());
$("#importFile").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;try{const data=JSON.parse(await file.text()),ids=new Set();if(!data||data.version!==VERSION||!Array.isArray(data.challenges)||!data.challenges.every(c=>{if(!validImportChallenge(c)||ids.has(c.id))return false;ids.add(c.id);return true})||(data.language!=="en"&&data.language!=="ar"))throw Error();if(!window.confirm(t("importConfirm")))return;const before=snapshot();state={version:VERSION,language:data.language,challenges:data.challenges};if(!persist()){state=before;return}selectedId=null;render();showToast(t("importDone"))}catch(_){showToast(t("importBad"))}});
load();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{});});}
</script>
</body>
</html>
